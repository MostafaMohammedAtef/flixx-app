<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="lib/fontawesome.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/spinner.css" />
    <script src="js/script.js" defer></script>
    <title>Flixx | Compare</title>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="/">FLIXX</a></div>
        <nav>
          <ul>
            <li><a class="nav-link" href="/">Movies</a></li>
            <li><a class="nav-link" href="/shows.html">TV Shows</a></li>
            <li><a class="nav-link" href="/discover.html">Discover</a></li>
            <li>
              <a class="nav-link" href="/watchlist.html"
                >Watchlist <span class="watchlist-count">0</span></a
              >
            </li>
            <li>
              <a class="nav-link" href="/compare.html"
                >Compare <span class="compare-count">0</span></a
              >
            </li>
            <li>
              <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle light theme">
                <i class="fas fa-sun"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="container compare-page">
      <div class="page-intro">
        <span class="eyebrow">Side by side</span>
        <h1>Compare titles</h1>
        <p>
          Choose up to three titles from any poster to compare the essentials.
        </p>
      </div>
      <div id="compare-results"></div>
      <div id="compare-empty" class="empty-state">
        <i class="fas fa-code-compare"></i>
        <h2>Nothing to compare yet</h2>
        <p>Use the compare icon on a movie or show card.</p>
        <a class="btn" href="discover.html">Browse titles</a>
      </div>
    </main>
    <footer class="main-footer">
      <div class="container">
        <div class="logo">FLIXX</div>
        <div class="social-links">
          <a href="https://www.facebook.com" target="_blank"
            ><i class="fab fa-facebook-f"></i></a
          ><a href="https://www.twitter.com" target="_blank"
            ><i class="fab fa-twitter"></i></a
          ><a href="https://www.instagram.com" target="_blank"
            ><i class="fab fa-instagram"></i
          ></a>
        </div>
      </div>
    </footer>
    <div class="spinner"></div>
  </body>
</html>
