<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="lib/fontawesome.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/spinner.css" />
    <script src="js/script.js" defer></script>
    <title>Flixx | Watchlist</title>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="./">FLIXX</a></div>
        <nav>
          <ul>
            <li><a class="nav-link" href="./">Movies</a></li>
            <li><a class="nav-link" href="./shows.html">TV Shows</a></li>
            <li>
              <a class="nav-link" href="./watchlist.html"
                >Watchlist <span class="watchlist-count">0</span></a
              >
            </li>
            <li>
              <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle light theme">
                <i class="fas fa-sun"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="container watchlist-page">
      <div class="page-intro">
        <span class="eyebrow">Saved for later</span>
        <h1>My Watchlist</h1>
        <p>Keep the films and series you do not want to forget.</p>
      </div>
      <div id="watchlist-results" class="grid"></div>
      <div id="watchlist-empty" class="empty-state" hidden>
        <i class="fas fa-bookmark"></i>
        <h2>Your watchlist is empty</h2>
        <p>Save a movie or show from any poster to see it here.</p>
        <a class="btn" href="./">Find something to watch</a>
      </div>
    </main>
    <footer class="main-footer">
      <div class="container">
        <div class="logo">FLIXX</div>
        <div class="social-links">
          <a
            href="https://github.com/MostafaMohammedAtef"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub"
            ><i class="fab fa-github"></i
          ></a>
          <a
            href="https://www.linkedin.com/in/mostafa-m-atef/"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn"
            ><i class="fab fa-linkedin-in"></i
          ></a>
        </div>
      </div>
    </footer>
    <div class="spinner"></div>
  </body>
</html>
