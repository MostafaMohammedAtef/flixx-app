<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="lib/swiper.css?v=20260908" />
    <link rel="stylesheet" href="lib/fontawesome.css?v=20260908" />
    <link rel="stylesheet" href="css/style.css?v=20260908" />
    <link rel="stylesheet" href="css/spinner.css?v=20260908" />
    <link rel="manifest" href="manifest.webmanifest?v=20260908" />
    <script src="lib/swiper.js?v=20260908"></script>
    <script src="js/script.js?v=20260908" defer></script>
    <title>Flixx</title>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="./">FLIXX</a></div>
        <nav>
          <ul>
            <li>
              <a class="nav-link" href="./">Movies</a>
            </li>
            <li>
              <a class="nav-link" href="./shows.html">TV Shows</a>
            </li>
            <li><a class="nav-link" href="./calendar.html">Calendar</a></li>
            <li>
              <a class="nav-link" href="./watchlist.html"
                >Watchlist <span class="watchlist-count">0</span></a
              >
            </li>
            <li>
              <a class="nav-link" href="./compare.html"
                >Compare <span class="compare-count">0</span></a
              >
            </li>
            <li>
              <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle light theme">
                <i class="fas fa-sun"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="now-playing">
      <h2>Now Playing</h2>
      <div class="swiper">
        <div class="swiper-wrapper"></div>
      </div>
    </section>

    <section class="search">
      <div class="container">
        <div id="alert"></div>
        <form action="./search.html" class="search-form">
          <div class="search-radio">
            <input type="radio" id="movie" name="type" value="movie" checked />
            <label for="movies">Movies</label>
            <input type="radio" id="tv" name="type" value="tv" />
            <label for="shows">TV Shows</label>
          </div>
          <div class="search-flex">
            <input
              type="text"
              name="search-term"
              id="search-term"
              list="search-suggestions"
              placeholder="Enter search term" />
            <datalist id="search-suggestions"></datalist>
            <button class="btn" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="container">
      <h2>Popular Movies</h2>
      <div id="popular-movies" class="grid"></div>
    </section>

    <footer class="main-footer">
      <div class="container">
        <div class="logo"><span>FLIXX</span></div>
        <div class="social-links">
          <a
            href="https://github.com/MostafaMohammedAtef"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/mostafa-m-atef/"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
        </div>
      </div>
    </footer>

    <div class="spinner"></div>
  </body>
</html>
